<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="fpBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#212831"/>
      <stop offset="100%" stop-color="#14181F"/>
    </linearGradient>
    <linearGradient id="fpWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#845D3B"/>
      <stop offset="50%" stop-color="#6E4B2D"/>
      <stop offset="100%" stop-color="#553820"/>
    </linearGradient>
    <linearGradient id="fpSofa" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBE7DE"/>
      <stop offset="100%" stop-color="#D5CEBF"/>
    </linearGradient>
    <linearGradient id="fpFilm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#C5A880" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="fpSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2DB" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#fpBg)"/>

  <!-- Large Picture Window with Sheer Drapery (Left) -->
  <rect x="40" y="40" width="220" height="440" fill="#2A3542"/>
  <rect x="40" y="40" width="80" height="440" fill="#EAE5DC" opacity="0.15"/>

  <!-- Luxury Neutral Linen Sectional Sofa in Background -->
  <!-- Sofa back -->
  <rect x="280" y="160" width="460" height="150" rx="18" fill="url(#fpSofa)"/>
  <line x1="510" y1="160" x2="510" y2="310" stroke="#C2B7A8" stroke-width="2"/>
  <!-- Decorative throw pillows -->
  <rect x="300" y="190" width="70" height="70" rx="10" fill="#586675" transform="rotate(-6 300 190)"/>
  <rect x="630" y="190" width="70" height="70" rx="10" fill="#C5A880" opacity="0.8" transform="rotate(8 630 190)"/>

  <!-- Sofa seating cushion -->
  <polygon points="240,310 740,310 760,400 220,400" fill="#E0DCD3"/>
  <line x1="490" y1="310" x2="490" y2="400" stroke="#C4B8A8" stroke-width="2"/>

  <!-- Textured Area Rug -->
  <ellipse cx="440" cy="460" rx="280" ry="90" fill="#1C232B"/>

  <!-- Centerpiece: Fine Natural Wood & Marble Coffee Table -->
  <!-- Top surface -->
  <polygon points="200,380 620,380 680,490 140,490" fill="url(#fpWood)"/>

  <!-- Wood grain details -->
  <g fill="none" stroke="#482F18" stroke-width="1.5" opacity="0.45">
    <path d="M 180 430 Q 380 420, 560 425 T 650 440"/>
    <path d="M 160 460 Q 360 450, 540 455 T 660 470"/>
    <ellipse cx="400" cy="440" rx="24" ry="8"/>
  </g>

  <!-- Clear Surface Protection Film Reflection / Glint -->
  <polygon points="200,380 620,380 680,490 140,490" fill="url(#fpFilm)"/>

  <!-- Front Bevel of Table -->
  <polygon points="140,490 680,490 680,515 140,515" fill="#4B311B"/>
  <line x1="140" y1="490" x2="680" y2="490" stroke="#FFFFFF" stroke-width="2" opacity="0.75"/>

  <!-- Minimalist Black Steel Legs -->
  <polygon points="180,515 200,515 220,570 190,570" fill="#11151A"/>
  <polygon points="620,515 640,515 630,570 600,570" fill="#11151A"/>

  <!-- Tabletop Coffee Table Styling (Art Book & Minimal Glass Carafe) -->
  <rect x="460" y="415" width="80" height="45" rx="3" fill="#EAE5DC" transform="rotate(-8 460 415)"/>
  <rect x="470" y="412" width="60" height="45" rx="2" fill="#2E3743" transform="rotate(-8 470 412)"/>
  <circle cx="340" cy="440" r="16" fill="#C5A880" opacity="0.7"/>

  <!-- Warm Natural Sunlight Angle -->
  <polygon points="0,40 300,40 600,600 0,600" fill="url(#fpSun)"/>
</svg>
