<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="odBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2129"/>
      <stop offset="100%" stop-color="#11151B"/>
    </linearGradient>
    <linearGradient id="odWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A5436"/>
      <stop offset="45%" stop-color="#916744"/>
      <stop offset="100%" stop-color="#67462B"/>
    </linearGradient>
    <linearGradient id="odFilm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#C5A880" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#odBg)"/>

  <!-- High-End Commercial Office Background -->
  <!-- Floor-to-Ceiling Skyline Windows in Background -->
  <rect x="100" y="40" width="600" height="240" fill="#202A36" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <line x1="300" y1="40" x2="300" y2="280" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <line x1="500" y1="40" x2="500" y2="280" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Modern Executive Chair (Silhouette in Background) -->
  <rect x="330" y="160" width="140" height="150" rx="16" fill="#151A21"/>
  <circle cx="400" cy="140" r="28" fill="#151A21"/>

  <!-- Office Flooring -->
  <polygon points="0,460 800,460 800,600 0,600" fill="#161B22"/>

  <!-- ========================================================
       PREMIUM EXECUTIVE DESK
       ======================================================== -->
  <!-- Desk Top Surface (Valuable Wood Grain & Leather Blotter) -->
  <polygon points="120,310 680,310 740,460 60,460" fill="url(#odWood)"/>

  <!-- Wood Grain Textures -->
  <g stroke="#482F1A" stroke-width="1.6" opacity="0.45" fill="none">
    <path d="M 100 420 Q 300 410, 500 415 T 710 430"/>
    <path d="M 90 440 Q 350 435, 550 440 T 730 450"/>
    <path d="M 120 370 Q 380 360, 540 365 T 700 380"/>
    <ellipse cx="400" cy="380" rx="20" ry="6"/>
  </g>

  <!-- Clear Surface Protection Film Coating (Optically Discreet) -->
  <polygon points="120,310 680,310 740,460 60,460" fill="url(#odFilm)"/>

  <!-- Front Bevel of Desk -->
  <polygon points="60,460 740,460 740,488 60,488" fill="#4B311B"/>
  <line x1="60" y1="460" x2="740" y2="460" stroke="#FFFFFF" stroke-width="2" opacity="0.75"/>

  <!-- Desk Pedestal Base & Modesty Panel in Blackened Steel -->
  <polygon points="100,488 200,488 180,570 120,570" fill="#101419"/>
  <polygon points="600,488 700,488 680,570 620,570" fill="#101419"/>
  <polygon points="200,488 600,488 590,540 210,540" fill="#192028"/>

  <!-- Executive Accessories (Laptop, Sleek Brass Pen Tray) -->
  <!-- Laptop Base -->
  <polygon points="340,360 460,360 470,400 330,400" fill="#8E99A8"/>
  <polygon points="340,360 460,360 455,310 345,310" fill="#2E3743" stroke="#8E99A8" stroke-width="2"/>
  <!-- Brass Pen Rest -->
  <rect x="520" y="380" width="80" height="12" rx="3" fill="#C5A880"/>
  <line x1="530" y1="386" x2="590" y2="386" stroke="#161A20" stroke-width="2"/>
</svg>
