<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="matBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2027"/>
      <stop offset="100%" stop-color="#11151A"/>
    </linearGradient>

    <!-- Calacatta Marble Sample -->
    <linearGradient id="matMarble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F5F2EC"/>
      <stop offset="100%" stop-color="#E4DDD2"/>
    </linearGradient>

    <!-- Warm Walnut Wood Sample -->
    <linearGradient id="matWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5738"/>
      <stop offset="50%" stop-color="#916744"/>
      <stop offset="100%" stop-color="#6E4B2E"/>
    </linearGradient>

    <!-- Engineered Quartz Stone Sample -->
    <linearGradient id="matQuartz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5663"/>
      <stop offset="50%" stop-color="#3C4652"/>
      <stop offset="100%" stop-color="#2D3540"/>
    </linearGradient>

    <!-- Brushed Brass Accent Strip -->
    <linearGradient id="matBrass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A58A63"/>
      <stop offset="50%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#DFC8A6"/>
    </linearGradient>

    <!-- Architectural Fluted Glass Sample -->
    <linearGradient id="matGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55697D" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#344352" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Film Glint Layer -->
    <linearGradient id="matFilm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#C5A880" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Textured Dark Studio Surface -->
  <rect width="800" height="800" fill="url(#matBg)"/>
  
  <!-- Subtle Studio Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
  </g>

  <!-- ========================================================
       ELEGANT MATERIAL FLAT-LAY SWATCHES
       ======================================================== -->

  <!-- 1. Marble Swatch (Top-Left) -->
  <g transform="translate(80, 100)">
    <!-- Drop Shadow -->
    <rect x="8" y="8" width="280" height="260" rx="14" fill="#0A0C10" opacity="0.6"/>
    <rect width="280" height="260" rx="14" fill="url(#matMarble)"/>
    <!-- Marble Veins -->
    <path d="M 20 40 Q 100 80, 160 50 T 260 110" stroke="#B8AEA0" stroke-width="2.6" fill="none" opacity="0.75"/>
    <path d="M 40 160 Q 140 190, 200 150 T 260 210" stroke="#C7BCAE" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 120 70 Q 150 130, 210 160" stroke="#D1C3B2" stroke-width="1.4" fill="none" opacity="0.8"/>
    <!-- Protective Film Sheen (Right Half) -->
    <path d="M 140 0 L 280 0 L 280 260 L 140 260 Z" fill="url(#matFilm)" rx="14"/>
    <line x1="140" y1="0" x2="140" y2="260" stroke="#C5A880" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- 2. Solid Walnut Wood Swatch (Top-Right) -->
  <g transform="translate(440, 100)">
    <!-- Drop Shadow -->
    <rect x="8" y="8" width="280" height="260" rx="14" fill="#0A0C10" opacity="0.6"/>
    <rect width="280" height="260" rx="14" fill="url(#matWood)"/>
    <!-- Wood grain -->
    <g stroke="#4B311B" stroke-width="1.8" opacity="0.45" fill="none">
      <path d="M 20 50 Q 140 45, 260 55"/>
      <path d="M 20 110 Q 140 100, 260 115"/>
      <path d="M 20 170 Q 140 165, 260 175"/>
      <path d="M 20 220 Q 140 215, 260 225"/>
      <ellipse cx="160" cy="110" rx="20" ry="8"/>
    </g>
    <!-- Protective Film Sheen -->
    <path d="M 140 0 L 280 0 L 280 260 L 140 260 Z" fill="url(#matFilm)" rx="14"/>
    <line x1="140" y1="0" x2="140" y2="260" stroke="#C5A880" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Center Brushed Brass Accent Divider Ribbon -->
  <rect x="390" y="60" width="20" height="680" rx="3" fill="url(#matBrass)"/>
  <line x1="400" y1="60" x2="400" y2="740" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>

  <!-- 3. Engineered Quartz Stone Swatch (Bottom-Left) -->
  <g transform="translate(80, 440)">
    <!-- Drop Shadow -->
    <rect x="8" y="8" width="280" height="260" rx="14" fill="#0A0C10" opacity="0.6"/>
    <rect width="280" height="260" rx="14" fill="url(#matQuartz)"/>
    <!-- Speckles & Minerals -->
    <g fill="#A3B0BF" opacity="0.4">
      <circle cx="50" cy="40" r="2.5"/><circle cx="90" cy="80" r="1.5"/><circle cx="160" cy="50" r="3"/>
      <circle cx="210" cy="90" r="2"/><circle cx="70" cy="150" r="2"/><circle cx="130" cy="190" r="2.5"/>
      <circle cx="190" cy="160" r="1.8"/><circle cx="240" cy="210" r="2.2"/><circle cx="60" cy="220" r="1.5"/>
    </g>
    <!-- Protective Film Sheen -->
    <path d="M 140 0 L 280 0 L 280 260 L 140 260 Z" fill="url(#matFilm)" rx="14"/>
    <line x1="140" y1="0" x2="140" y2="260" stroke="#C5A880" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- 4. Architectural Fluted Glass & Mirror Swatch (Bottom-Right) -->
  <g transform="translate(440, 440)">
    <!-- Drop Shadow -->
    <rect x="8" y="8" width="280" height="260" rx="14" fill="#0A0C10" opacity="0.6"/>
    <rect width="280" height="260" rx="14" fill="url(#matGlass)"/>
    <!-- Fluted Ribs -->
    <g stroke="rgba(255,255,255,0.22)" stroke-width="3">
      <line x1="35" y1="0" x2="35" y2="260"/>
      <line x1="70" y1="0" x2="70" y2="260"/>
      <line x1="105" y1="0" x2="105" y2="260"/>
      <line x1="140" y1="0" x2="140" y2="260"/>
      <line x1="175" y1="0" x2="175" y2="260"/>
      <line x1="210" y1="0" x2="210" y2="260"/>
      <line x1="245" y1="0" x2="245" y2="260"/>
    </g>
    <!-- Protective Film Sheen -->
    <path d="M 140 0 L 280 0 L 280 260 L 140 260 Z" fill="url(#matFilm)" rx="14"/>
    <line x1="140" y1="0" x2="140" y2="260" stroke="#C5A880" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Soft Studio Light Spot Overhead -->
  <circle cx="400" cy="400" r="300" fill="#FFE8C4" opacity="0.06"/>
</svg>
