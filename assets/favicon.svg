      <stop offset="0%" stop-color="#1E2630"/>
      <stop offset="100%" stop-color="#0F141A"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A880"/>
